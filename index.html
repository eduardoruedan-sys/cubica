<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Matrix Cubic Graph</title>

<style>
body{
margin:0;
background:black;
overflow:hidden;
}

canvas{
display:block;
}
</style>

</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

/* símbolos estilo Matrix (katakana + números) */
const letters = "アカサタナハマヤラワ0123456789アイウエオカキクケコサシスセソタチツテト";

const fontSize = 18;
const columns = canvas.width / fontSize;

const drops = [];

for(let i=0;i<columns;i++)
drops[i] = Math.random()*canvas.height;

let progress = -3;

function draw(){

ctx.fillStyle = "rgba(0,0,0,0.08)";
ctx.fillRect(0,0,canvas.width,canvas.height);

drawMatrix();
drawAxes();
drawFunction();

}

function drawMatrix(){

ctx.fillStyle="#00ff41";
ctx.font = fontSize+"px monospace";

for(let i=0;i<drops.length;i++){

const text = letters.charAt(Math.floor(Math.random()*letters.length));

ctx.fillText(text,i*fontSize,drops[i]);

if(drops[i] > canvas.height && Math.random()>0.975)
drops[i]=0;

drops[i]+=fontSize;

}

}

function drawAxes(){

const cx = canvas.width/2;
const cy = canvas.height/2;

ctx.strokeStyle="rgba(0,255,0,0.4)";
ctx.lineWidth=1;

ctx.beginPath();
ctx.moveTo(0,cy);
ctx.lineTo(canvas.width,cy);
ctx.stroke();

ctx.beginPath();
ctx.moveTo(cx,0);
ctx.lineTo(cx,canvas.height);
ctx.stroke();

}

function drawFunction(){

ctx.strokeStyle="#00ff41";
ctx.lineWidth=3;

const scale = 80;
const cx = canvas.width/2;
const cy = canvas.height/2;

ctx.beginPath();

for(let x=-3;x<=progress;x+=0.02){

let y = x*x*x;

let px = cx + x*scale;
let py = cy - y*scale/10;

if(x===-3)
ctx.moveTo(px,py);
else
ctx.lineTo(px,py);

}

ctx.stroke();

progress += 0.03;

if(progress > 3){
progress = -3;
}

}

setInterval(draw,30);

</script>

</body>
</html>
